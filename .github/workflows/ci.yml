name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://user:password@localhost:5432/observador?schema=public
  BETTER_AUTH_SECRET: ci-only-secret-change-me-0123456789abcdef
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  quality:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar esquema Prisma
        run: npm run db:validate

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas unitarias
        run: npm run test

      - name: Build de producción
        run: npm run build

  e2e:
    name: Pruebas E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Ejecutar Playwright
        run: npm run test:e2e

      - name: Guardar trazas si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  mobile-version:
    name: Android · versionado
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: versionName y package.json deben coincidir
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const props = fs.readFileSync('mobile/android/version.properties', 'utf8');
          const versionName = (props.match(/^versionName=(.+)$/m) || [])[1];
          const versionCode = (props.match(/^versionCode=(.+)$/m) || [])[1];
          const pkg = JSON.parse(fs.readFileSync('mobile/package.json', 'utf8'));
          if (!versionName || !versionCode) {
            throw new Error('version.properties debe definir versionName y versionCode');
          }
          if (!/^\d+\.\d+\.\d+$/.test(versionName.trim())) {
            throw new Error(`versionName inválido: ${versionName}`);
          }
          if (!/^[1-9]\d*$/.test(versionCode.trim())) {
            throw new Error(`versionCode inválido: ${versionCode}`);
          }
          if (versionName.trim() !== pkg.version) {
            throw new Error(`versionName ${versionName.trim()} no coincide con package.json ${pkg.version}`);
          }
          console.log(`Versión ${versionName.trim()} (versionCode ${versionCode.trim()})`);
          NODE

  mobile:
    name: Android · pruebas y APK debug
    runs-on: ubuntu-latest
    needs: mobile-version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Plataforma Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Caché de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Interfaz web y sincronización
        working-directory: mobile
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Pruebas unitarias y assembleDebug
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          OWNER="${GITHUB_REPOSITORY%%/*}"
          NAME="${GITHUB_REPOSITORY#*/}"
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon \
            -PeocGithubOwner="$OWNER" \
            -PeocGithubRepo="$NAME"

      - name: Publicar APK debug
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-pruebas-${{ github.sha }}
          path: mobile/android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
